aid: thrive-agritech
name: Thrive Agritech
description: >-
  Thrive Agritech is a horticultural lighting company that designs and
  manufactures high-efficiency LED grow lights and related power systems for
  commercial indoor farming, greenhouses, and vertical farming operations. Its
  product line includes fixtures such as Strata, Boost XE, and a 1050W LED grow
  light, along with a Remote Power System, backed by lighting design services,
  rebate assistance, and multi-year warranties. The company positions itself
  around energy efficiency, ROI, and long-term grower partnerships rather than a
  developer or API offering. Surfaced as a Y Combinator portfolio company and
  added to the API Evangelist network, this profile was enriched by probing the
  public web surface; no public API, developer portal, documentation, or
  machine-readable specification was found.
